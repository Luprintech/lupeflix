<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LupeFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-left">
      <span class="logo">LUPEFLIX</span>
      <ul class="nav-links">
        <li><a href="#" class="active">Inicio</a></li>
        <li><a href="#" data-filter="series">Series</a></li>
        <li><a href="#" data-filter="movies">Películas</a></li>
        <li class="dropdown">
          <a href="#">Géneros <span class="arrow">▾</span></a>
          <ul class="dropdown-menu">
            <li><a href="#" data-genre="28">Acción</a></li>
            <li><a href="#" data-genre="35">Comedia</a></li>
            <li><a href="#" data-genre="27">Terror</a></li>
            <li><a href="#" data-genre="878">Ciencia Ficción</a></li>
            <li><a href="#" data-genre="10749">Romance</a></li>
            <li><a href="#" data-genre="18">Drama</a></li>
            <li><a href="#" data-genre="16">Animación</a></li>
            <li><a href="#" data-genre="53">Thriller</a></li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="nav-right">
      <button class="nav-icon-btn" id="searchToggle" title="Buscar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" placeholder="Buscar películas, series..." />
      </div>
      <div class="user-menu">
        <span class="user-avatar" id="userAvatar">U</span>
        <div class="user-dropdown">
          <p id="userName" class="user-name"></p>
          <a href="#" id="logoutBtn">Cerrar sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge" id="heroBadge">PELÍCULA</div>
      <h1 class="hero-title" id="heroTitle">Cargando...</h1>
      <p class="hero-meta" id="heroMeta"></p>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-btns">
        <button class="btn-play" id="heroPlay">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Ver Ahora
        </button>
        <button class="btn-info" id="heroInfo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          Más info
        </button>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- CONTENT -->
  <main class="main-content">
    <div id="sectionsContainer"></div>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-hero" id="modalHero"></div>
      <div class="modal-body">
        <div class="modal-info">
          <h2 id="modalTitle"></h2>
          <div class="modal-meta" id="modalMeta"></div>
          <p id="modalDesc"></p>
        </div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
